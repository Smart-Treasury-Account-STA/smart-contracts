name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the exact version in `rust-toolchain.toml`, not `@stable`
      # (a floating tag) — this project already got burned once by an
      # unpinned toolchain (see the `install stellar CLI` step below, where
      # a *different* floating "stable" broke on a dependency's own
      # zero-sized-transmute fallback). Keeping this in sync with
      # `rust-toolchain.toml` means CI and local `cargo`/`rustup` always
      # agree on which Rust actually built and tested this workspace.
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
          # `stellar contract build` compiles every contract for this target;
          # it's not installed by default and isn't pulled in by fmt/clippy/test.
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - name: install stellar-cli's native Linux build deps
        # `keyring` (OS credential storage) needs `libdbus-sys` -> `dbus-1.pc`.
        # `stellar-ledger` (hardware-wallet support) needs `hidapi` ->
        # `libudev.pc`. Neither ships on `ubuntu-latest` by default, so the
        # build fails with "The system library `dbus-1`/`libudev` ... was
        # not found." macOS needs neither (Keychain/IOKit cover both natively).
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config
      - name: install stellar CLI
        # Plain `cargo build --target wasm32v1-none` doesn't work here: the
        # workspace opts into soroban-sdk's `experimental_spec_shaking_v2`
        # feature, which is only supported through `stellar contract build`
        # (stellar-cli 25.2.0+) — the same tool `scripts/deploy_testnet.sh`
        # uses, so this step exercises the real build path, not a proxy for it.
        #
        # stellar-cli 26.0.0's published Cargo.lock pins `ethnum 1.5.2`,
        # whose `TryFromIntError` zero-sized-transmute fallback breaks on
        # Rust >=1.97 (rust-lang/rust#157363). Fixed upstream in ethnum
        # 1.5.3, but `--locked` means we can't pick that up ourselves here.
        # Build stellar-cli with a pinned pre-regression toolchain so this
        # keeps working regardless of which Rust `stable` resolves to for
        # the rest of this job.
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          cargo +1.96.0 install --locked stellar-cli --version 26.0.0
      - name: stellar contract build
        run: stellar contract build --optimize --out-dir wasm
      - name: verify account_factory's WASM fixtures are not stale
        # Security review finding: contracts/account_factory/src/wasm_fixtures/
        # are real, committed WASM binaries sta-account-factory's own test
        # suite deploys against — if a contract in that fixture set changes
        # and the fixtures aren't regenerated (see that directory's own
        # README.md), its tests keep passing against the *old* behavior of
        # whichever contract changed: a false green, not a real one. This
        # fails the build the moment that happens, rather than relying on
        # someone remembering to regenerate them by hand.
        run: |
          for name in sta_policy_engine sta_intent_registry sta_recovery_manager sta_transfer_adapter sta_split_adapter sta_smart_account; do
            if ! cmp -s "wasm/$name.wasm" "contracts/account_factory/src/wasm_fixtures/$name.wasm"; then
              echo "::error::contracts/account_factory/src/wasm_fixtures/$name.wasm is stale relative to current source -- see that directory's README.md to regenerate it."
              exit 1
            fi
          done
