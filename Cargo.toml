[workspace]
members = [
    "contracts/smart_account_poc",
    "contracts/policy_registry_poc",
    "contracts/intent_registry_poc",
    "contracts/recovery_guard_poc",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
soroban-sdk = { version = "22.0.1", features = [] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
